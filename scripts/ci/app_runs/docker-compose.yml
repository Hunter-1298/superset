# `app-runs` integration stack: the exact `ci` image digest under test, Postgres
# metadata, Redis broker/results and one Celery worker. Driven by
# scripts/ci/app_runs.py; not intended for local development.
x-superset: &superset
  image: ${SUPERSET_IMAGE:?SUPERSET_IMAGE (repo@sha256:...) is required}
  platform: linux/amd64
  pull_policy: never
  environment: &superset-env
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?required}
    DATABASE_USER: superset
    DATABASE_PASSWORD: ${DATABASE_PASSWORD:?required}
    DATABASE_HOST: postgres
    DATABASE_PORT: "5432"
    DATABASE_DB: superset
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    SUPERSET_LOAD_EXAMPLES: "no"
  volumes:
    - ./superset_config.py:/app/pythonpath/superset_config.py:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?required}
      POSTGRES_DB: superset
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  superset-init:
    <<: *superset
    command: ["superset", "db", "upgrade"]

  superset:
    <<: *superset
    ports:
      - "127.0.0.1:${APP_RUNS_PORT:-8088}:8088"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully

  worker:
    <<: *superset
    command:
      - celery
      - --app=superset.tasks.celery_app:app
      - worker
      - -O
      - fair
      - -l
      - INFO
      - --concurrency=1
    healthcheck:
      test:
        - CMD-SHELL
        - celery --app=superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME --timeout 10
      interval: 10s
      timeout: 15s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
