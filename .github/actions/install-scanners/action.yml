name: "Install hardening-loop tooling and pinned scanners"
description: >
  Checks out the hardening-loop controller at a pinned ref, installs its CLI
  (gate, vex-lint, forbid-ignore-files, scan-manifest) and, optionally, the
  pinned Syft 1.45.1 / Trivy 0.71.2 / Grype 0.114.0 binaries. Every release
  asset is verified against a hard-coded SHA-256 and the publisher's Sigstore
  signature before it is installed; the installed binaries must report the
  pinned versions or the step fails.
inputs:
  controller-repo:
    description: "owner/name of the hardening-loop controller repository"
    required: false
    default: "Hunter-1298/superset-hardening-loop"
  controller-ref:
    description: >
      controller commit to install. Must be a full 40-hex SHA except on
      workflow_dispatch runs, where a branch or tag may be tried out.
    required: true
  controller-path:
    description: "checkout path for the controller (relative to the workspace)"
    required: false
    default: ".hardening-loop"
  scanners:
    description: "install the pinned Syft/Trivy/Grype binaries ('true'/'false')"
    required: false
    default: "true"
outputs:
  controller-path:
    description: "absolute path of the controller checkout"
    value: ${{ steps.paths.outputs.controller }}
  controller-sha:
    description: "resolved controller commit"
    value: ${{ steps.paths.outputs.controller_sha }}
runs:
  using: composite
  steps:
    - name: Refuse a mutable controller ref outside manual runs
      shell: bash
      env:
        REF: ${{ inputs.controller-ref }}
      run: |
        set -euo pipefail
        if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
          exit 0
        fi
        if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
          echo "::error::controller-ref '${REF}' is not a commit SHA; ${GITHUB_EVENT_NAME} runs must use the committed pin"
          exit 1
        fi
        echo "::warning::manual run installs the controller from mutable ref '${REF}'; its evidence is not reproducible"

    - name: Checkout hardening-loop controller (${{ inputs.controller-ref }})
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        repository: ${{ inputs.controller-repo }}
        ref: ${{ inputs.controller-ref }}
        path: ${{ inputs.controller-path }}
        persist-credentials: false

    - name: Setup Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"

    - name: Install hardening-loop CLI
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --quiet --upgrade pip
        python -m pip install --quiet "${GITHUB_WORKSPACE}/${{ inputs.controller-path }}"
        hardening-loop --help > /dev/null

    - name: Install cosign (for Sigstore verification of scanner checksums)
      if: inputs.scanners == 'true'
      uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

    - name: Install pinned Syft / Trivy / Grype
      if: inputs.scanners == 'true'
      shell: bash
      env:
        VERIFY_SIGNATURES: "1"
      run: |
        set -euo pipefail
        mkdir -p "${HOME}/.local/bin"
        "${GITHUB_WORKSPACE}/${{ inputs.controller-path }}/scripts/install_scanners.sh" "${HOME}/.local/bin"
        echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

    - name: Assert scanner versions
      if: inputs.scanners == 'true'
      shell: bash
      run: |
        set -euo pipefail
        syft version -o json | grep -q '"version": *"1.45.1"'
        trivy --version | grep -q 'Version: 0.71.2'
        grype version -o json | grep -q '"version": *"0.114.0"'
        {
          echo "### scanner tool pins"
          echo
          echo '```'
          syft version | sed -n '1,4p'
          trivy --version | sed -n '1p'
          grype version | sed -n '1,4p'
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Record controller checkout
      id: paths
      shell: bash
      env:
        REF: ${{ inputs.controller-ref }}
      run: |
        set -euo pipefail
        CONTROLLER="${GITHUB_WORKSPACE}/${{ inputs.controller-path }}"
        SHA="$(git -C "${CONTROLLER}" rev-parse HEAD)"
        if [[ "$REF" =~ ^[0-9a-f]{40}$ ]] && [ "$SHA" != "$REF" ]; then
          echo "::error::checked out controller ${SHA}, expected pin ${REF}"
          exit 1
        fi
        echo "controller=${CONTROLLER}" >> "$GITHUB_OUTPUT"
        echo "controller_sha=${SHA}" >> "$GITHUB_OUTPUT"
        echo "controller: ${SHA}" >> "$GITHUB_STEP_SUMMARY"
